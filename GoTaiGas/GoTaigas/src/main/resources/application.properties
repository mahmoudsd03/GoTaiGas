# Public-safe application configuration.
# Configure these values through environment variables on your machine/deployment.

# PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gotaigas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:gotaigas}

# KIConnect chatbot
# Never commit a real API key. Set KICONNECT_API_KEY in your environment.
kiconnect.api.key=${KICONNECT_API_KEY:}
kiconnect.api.url=${KICONNECT_API_URL:https://chat.kiconnect.nrw/api/v1/chat/completions}
kiconnect.model=${KICONNECT_MODEL:LLAMA 3.1 8B}
